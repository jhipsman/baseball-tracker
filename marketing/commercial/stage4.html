const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const outExpo = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
const outBack = (x) => { const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const inOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const lerp = (a, b, x) => a + (b - a) * x;
const set = (el, o) => { el = typeof el === "string" ? $(el) : el; if (el) for (const k in o) el.style[k] = o[k]; };

const cap = (id, a, b) => `<div class="abs wm cap" id="${id}">${a}<em>${b}</em></div>`;
const R = 1060; // right column left edge
const dots = (k, on, c, size = 20) => Array.from({ length: k }, (_, i) => `<span style="display:inline-block;width:${size}px;height:${size}px;border-radius:50%;margin:0 4px;background:${i < on ? c : "rgba(255,255,255,.16)"}"></span>`).join("");
const miniBases = (b, s = 54) => `<svg viewBox="0 0 54 54" width="${s}" height="${s}">${[[27, 9], [45, 27], [9, 27]].map(([x, y], i) => `<rect x="${x - 7}" y="${y - 7}" width="14" height="14" transform="rotate(45 ${x} ${y})" fill="${b[i] ? "#f5b83c" : "rgba(255,255,255,.18)"}"/>`).join("")}</svg>`;

add("lock", `${cap("c_lock", "On every", "lock screen.")}
  <div class="abs phoneL" id="lockPhone" style="left:1180px; top:40px"><div class="scr" style="background:linear-gradient(180deg,#1b3326 0%,#0d1712 55%,#07090a)">

add("paid", `${cap("c_paid", "Get", "paid.")}

  <div class="abs card" id="collCard" style="left:${R - 60}px; top:680px; width:820px; background:linear-gradient(160deg,#1b2620,#0c0f0e)"><div class="mut">Collected</div><div id="collNum" class="big" style="font-size:130px; color:#8af0b8">$0</div></div>`);

// reach
add("reach", `${cap("c_reach", "Reach", "everyone.")}
  <div class="abs card" id="compose" style="left:${R - 60}px; top:110px; width:820px"><div class="mut">Announcement to the team &amp; parents</div>
    <div class="row" style="margin-top:18px"><div id="typed" style="flex:1; font-size:40px; font-weight:700; min-height:52px"></div><div id="sendBtn" style="width:130px; height:80px; border-radius:22px; display:grid; place-items:center; background:var(--g); color:#04140b; font-size:28px; font-weight:800">Send</div></div></div>
  <div class="abs" style="left:${R - 60}px; top:420px; width:820px; display:flex; justify-content:space-between">${[0, 1, 2].map((i) => `<div class="mini" id="mp${i}"><div class="scr"><div style="position:absolute;left:0;right:0;top:150px;text-align:center;font-size:62px;font-weight:600;color:rgba(255,255,255,.85)">9:41</div><div class="banner" id="bn${i}"><b>Riverside Rays</b>Fall Classic: arrive 8 AM ⚾</div></div></div>`).join("")}</div>`);

// real
add("real", `<div class="abs" id="laptop" style="left:120px; top:150px; width:1180px; border-radius:26px; overflow:hidden; box-shadow: 0 0 0 2px rgba(255,255,255,.1), 0 60px 120px -30px rgba(0,0,0,.95)"><div style="height:40px; background:#15171a"></div><img src="shots2/dash.png" style="width:100%; display:block"/></div>
  <div class="abs phoneL" id="realPhone" style="left:1350px; top:60px; transform: scale(.92); transform-origin: top left"><div class="scr" style="background:#000"><img src="shots2/phone-player.png" style="width:100%"/></div></div>
  <div class="abs wm" id="aud" style="left:0; right:0; top:860px; text-align:center; font-size:150px"></div>`);

// end
add("end", `<div class="abs" id="endMark" style="left:860px; top:200px; width:200px; height:200px; filter: drop-shadow(0 0 50px rgba(61,220,132,.65))">${MARK()}</div>
  <div class="abs wm" id="endWord" style="left:0; right:0; top:420px; text-align:center; font-size:270px">9D</div>
  <div class="abs" id="endTag" style="left:0; right:0; top:720px; text-align:center; font-size:58px; font-weight:800; color:var(--g); letter-spacing:-0.03em">Built for baseball.</div>
  <div class="abs" id="endAud" style="left:0; right:0; top:810px; text-align:center; font-size:30px; font-weight:600; color:rgba(255,255,255,.65)">Coaches · Clubs · Parents · Players</div>
  <div class="abs" id="endCo" style="left:0; right:0; top:1010px; text-align:center; font-size:22px; font-weight:600; color:rgba(255,255,255,.35); letter-spacing:.14em">9D SYSTEMS</div>`);

// static fills
["M", "T", "W", "T", "F", "S", "S"].forEach((d, i) => $("days").insertAdjacentHTML("beforeend", `<div id="day${i}" style="padding:16px 0; border-radius:18px; background:${i === 5 ? "rgba(61,220,132,.1)" : "rgba(255,255,255,.04)"}"><div class="mut">${d}</div><div style="font-size:42px; font-weight:800; margin-top:6px">${26 + i > 31 ? 26 + i - 31 : 26 + i}</div><div style="height:120px"></div></div>`));
[20, 25, 30, 35].forEach((v, i) => $("bars").insertAdjacentHTML("beforeend", `<div style="flex:1; text-align:center"><div id="bv${i}" style="font-size:34px; font-weight:800; margin-bottom:10px">${v}</div><div id="bar${i}" style="height:0; border-radius:16px 16px 6px 6px; background:${i === 2 ? "linear-gradient(180deg,#5ee89c,#12b76a)" : "rgba(61,220,132,.35)"}"></div><div class="mut" style="margin-top:12px">Wk ${i + 1}</div></div>`));
["Aug", "Sep", "Oct", "Nov"].forEach((m, i) => $("inst").insertAdjacentHTML("beforeend", `<div class="row" style="margin-top:${i ? 20 : 0}px"><div class="nm" style="width:110px">${m}</div><div class="mut">Installment ${i + 1} · $150 × 9</div><div class="pill pz" id="ip${i}">Due</div></div>`));
const SPRAY = [[300, 380], [700, 360], [560, 300], [430, 520], [820, 460], [620, 560], [380, 300]];
SPRAY.forEach(([x, y], i) => $("spray").insertAdjacentHTML("beforeend", `<circle cx="${x}" cy="${y}" r="11" fill="${i % 3 ? "#5ee89c" : "#f5b83c"}" opacity=".55"/>`));
[[60, 80], [180, 90], [130, 60], [90, 140], [160, 130], [118, 40], [40, 120], [200, 120]].forEach(([x, y], i) => $("sprayS").insertAdjacentHTML("beforeend", `<circle id="ss${i}" cx="${x}" cy="${y}" r="8" fill="${i % 3 ? "#5ee89c" : "#f5b83c"}" opacity="0"/>`));
const FEED = [
  [LV.pitches[0], "PITCH 1", "Ball · 1–0", 0],
  [LV.pitches[1], "PITCH 2", "Called strike · 1–1", 0],
  [LV.pitches[2], "PITCH 3", "Ball · 2–1", 0],
  [LV.hit, "HIT", "Carter Hayes doubles to left-center", 1],
  [LV.run, "RUN", "Jackson Reed scores · Rays 4–2", 2],
  [LV.feedNext, "ON DECK", "Aiden Murphy · .412 this season", 0]];
FEED.forEach(([, k, txt, hl], i) => $("feedWrap").insertAdjacentHTML("beforeend", `<div class="feed" id="f${i}" style="${hl ? `background:${hl === 2 ? "rgba(61,220,132,.2)" : "rgba(245,184,60,.16)"}; box-shadow: inset 0 0 0 2px ${hl === 2 ? "rgba(61,220,132,.7)" : "rgba(245,184,60,.6)"};` : ""}"><small style="${hl ? `color:${hl === 2 ? "#8af0b8" : "#f8ca6b"}` : ""}">${k}</small>${txt}</div>`));
$("rvMark").innerHTML = MARK();

// ---------------------------------------------------------------- render
function vis(id, t, fade = 0.12) { const [a, b] = S[id]; const v = Math.min(prog(t, a, a + fade), 1 - prog(t, b - fade, b)); set(id, { opacity: v, visibility: v <= 0 ? "hidden" : "visible" }); return t - a; }
function slam(id, l, at = 0, dur = 0.35) { const x = outExpo(prog(l, at, at + dur)); set(id, { opacity: clamp(x * 2), transform: `scale(${lerp(1.4, 1, x)}) skewX(${lerp(-12, 0, x)}deg)`, filter: `blur(${lerp(16, 0, x)}px)`, transformOrigin: "left center" }); }
function rise(id, l, at = 0, dur = 0.5, dy = 100) { const x = outExpo(prog(l, at, at + dur)); set(id, { opacity: clamp(x * 1.6), transform: `translateY(${lerp(dy, 0, x)}px) rotateX(${lerp(16, 0, x)}deg)` }); }
const pop = (t, at, dur = 0.35) => outBack(prog(t, at, at + dur));
const BASE = { home: [520, 790], 1: [710, 600], 2: [520, 410], 3: [330, 600] };
function along(path, p) { // position along a list of base keys
  const pts = path.map((k) => BASE[k]); const seg = (pts.length - 1) * clamp(p); const i = Math.min(Math.floor(seg), pts.length - 2); const f = seg - i;
  return [lerp(pts[i][0], pts[i + 1][0], f), lerp(pts[i][1], pts[i + 1][1], f)];
}

window.DURATION = TL.duration;
window.render = (t) => {
  set("bg", { "--gx": `${10 + 30 * Math.sin(t / 6)}%`, "--gy": `${10 + 10 * Math.cos(t / 4)}%`, "--ax": `${92 - 20 * Math.sin(t / 5)}%` });
  set("lines", { transform: `translateY(${(t * 32) % 96}px)` });

  let l = vis("hook", t, 0.05);
  TL.hookWords.forEach((at, i) => { const x = prog(l, at, at + 0.25); set("hw" + i, { opacity: x, transform: `scale(${lerp(1.6, 1, outExpo(x))})`, transformOrigin: "left center", filter: `blur(${lerp(12, 0, x)}px)` }); set("hs" + i, { width: `${prog(l, TL.strike + i * 0.1, TL.strike + 0.25 + i * 0.1) * 104}%` }); });
  set("hook", { transform: `scale(${lerp(1, 0.85, inOut(prog(l, 3.3, 4)))})`, filter: `blur(${prog(l, 3.35, 3.75) * 20}px)` });

  l = vis("reveal", t, 0.05);
  const r = outBack(prog(l, 0, 0.55)); set("rvMark", { transform: `rotate(${lerp(-180, 0, r)}deg) scale(${lerp(0.2, 1, r)})`, opacity: clamp(r * 3) });
  const rw = outExpo(prog(l, 0.35, 0.9)); set("rvWord", { opacity: rw, transform: `translateY(${lerp(70, 0, rw)}px) skewX(${lerp(-14, 0, rw)}deg)` });
  const rt = outExpo(prog(l, 1.1, 1.6)); set("rvTag", { opacity: rt, transform: `translateY(${lerp(30, 0, rt)}px)` });

  // dashboard
  l = vis("dash", t); slam("c_dash", l);
  ["d0", "d1", "d2", "d3", "d4"].forEach((id, i) => { const p = outBack(prog(t, E.land[i] - 0.15, E.land[i] + 0.3)); set(id, { opacity: clamp(p * 2), transform: `translateY(${lerp(80, 0, clamp(p, 0, 1.1))}px) scale(${lerp(0.85, 1, clamp(p, 0, 1.05))})` }); });
  const dc = outExpo(prog(t, E.land[1], E.land[1] + 1.4));
  $("d1n").textContent = Math.round(83 * dc) + "%"; $("ring").setAttribute("stroke-dashoffset", 389.6 * (1 - 0.83 * dc));
  $("d3n").textContent = "$" + Math.round(5400 * outExpo(prog(t, E.land[3], E.land[3] + 1.4))).toLocaleString("en-US");
  $("d0r").textContent = `✓ ${Math.round(11 * outExpo(prog(t, E.land[0] + 0.2, E.land[0] + 1.6)))} of 12 going`;

  // live game
  l = vis("live", t);
  rise("sbar", l, 0, 0.5, -60);
  set("field", { opacity: outExpo(prog(l, 0.1, 0.6)), transform: `scale(${lerp(0.94, 1, outExpo(prog(l, 0.1, 0.8)))})` });
  const pitchesIn = LV.pitches.filter((x) => t >= x).length;
  const balls = [0, 1, 1, 2][pitchesIn], strikes = [0, 0, 1, 1][pitchesIn];
  const afterHit = t >= LV.hit;
  $("sCount").innerHTML = afterHit ? "" : `B ${dots(3, balls, "#3ddc84")} S ${dots(2, strikes, "#f5b83c")}`;
  $("sOuts").innerHTML = `OUT ${dots(2, 1, "#ff5d5d")}`;
  const runP = prog(t, LV.hit + 0.2, LV.runnerDone);
  const bases = !afterHit ? [true, false, false] : runP < 1 ? [false, false, false] : [false, true, false];
  $("sBases").innerHTML = miniBases(bases, 66);
  $("sUs").textContent = t >= LV.run ? 4 : 3;
  set("sUs", { color: t >= LV.run ? "#3ddc84" : "#fff", display: "inline-block", transform: `scale(${t >= LV.run ? lerp(1.6, 1, pop(t, LV.run, 0.4)) : 1})` });
  const bp = inOut(prog(t, LV.hit, LV.hit + 0.6));
  $("ballPath").setAttribute("stroke-dashoffset", 900 * (1 - bp));
  const bt = $("ballPath").getTotalLength(), bpt = $("ballPath").getPointAtLength(bt * bp);
  $("ball").setAttribute("cx", bpt.x); $("ball").setAttribute("cy", bpt.y); $("ball").setAttribute("opacity", t >= LV.hit ? 1 : 0);
  const [x1, y1] = along(["1", "2", "3", "home"], inOut(runP));
  $("r1").setAttribute("transform", `translate(${x1} ${y1})`); $("r1").setAttribute("opacity", t >= LV.run + 0.6 ? 0 : 1);
  const [x2, y2] = along(["home", "1", "2"], inOut(runP));
  $("r2").setAttribute("transform", `translate(${x2} ${y2})`); $("r2").setAttribute("opacity", afterHit ? 1 : 0);
  const rp = prog(t, LV.run, LV.run + 1.1);
  set("runPop", { opacity: rp > 0 && rp < 1 ? Math.min(1, (1 - rp) * 3) : 0, transform: `scale(${lerp(0.5, 1.15, outBack(clamp(rp * 2.5)))}) rotate(-6deg)` });
  FEED.forEach(([at], i) => { const shown = FEED.filter(([a]) => t >= a).length; const p = outExpo(prog(t, at, at + 0.35)); const slot = shown - 1 - i; set("f" + i, { top: `${slot * 104 + lerp(-90, 0, p)}px`, opacity: t >= at ? clamp(p * 2) * (slot > 4 ? 0 : 1) : 0, transform: `scale(${i === 3 || i === 4 ? lerp(1.12, 1, p) : 1})` }); });
  set("liveDot", { opacity: 0.4 + 0.6 * Math.abs(Math.sin(t * 3)) });
  slam("c_live", l, 5.4);

  // lock screen
  l = vis("lock", t); slam("c_lock", l);
  set("lockPhone", { transform: `translateY(${lerp(700, 0, outExpo(prog(l, 0, 0.7)))}px) rotateY(${-10 + 4 * Math.sin(l)}deg) rotateX(4deg)` });
  const up = TL.lockUpdates.filter((x) => t >= x).length;
  $("laUs").textContent = up >= 2 ? 5 : 4; $("laInn").textContent = up >= 1 ? "▲5 · 2 outs" : "▲5 · 1 out";
  $("laPlay").textContent = ["Hayes doubles, Reed scores", "Murphy strikes out swinging", "Chen singles, Hayes scores"][up];
  $("laBases").innerHTML = miniBases(up >= 2 ? [true, false, false] : [false, true, false], 40);
  const lu = TL.lockUpdates[up - 1]; set("la", { boxShadow: `0 10px 30px rgba(0,0,0,.4), 0 0 0 ${up ? 3 * clamp(1 - (t - lu) * 1.5) : 0}px rgba(61,220,132,.9)` });
  const isw = up ? lerp(150, 380, outBack(clamp(1 - Math.abs(t - lu - 0.4) * 1.2))) : 150;
  set("island", { width: `${isw}px`, marginLeft: `${-isw / 2}px` }); $("isL").textContent = isw > 260 ? "RAYS" : ""; $("isR").textContent = isw > 260 ? `${up >= 2 ? 5 : 4}–2` : "";
  [0, 1, 2].forEach((i) => { const p = pop(t, E.dings[i], 0.4); set("n" + i, { opacity: clamp(p * 2), transform: `translateY(${lerp(-60, 0, clamp(p))}px) scale(${lerp(0.92, 1, p)})` }); });

  // schedule
  l = vis("schedule", t); slam("c_sched", l); rise("calCard", l, 0.05); rise("rsvpCard", l, 0.2);
  const gc = pop(t, E.land[5] - 0.25, 0.4);
  set("gameChip", { opacity: clamp(gc * 2), transform: `translateY(${lerp(-360, 0, outExpo(prog(t, E.land[5] - 0.35, E.land[5])))}px) scale(${lerp(1.3, 1, gc)})` });
  [0, 1, 2].forEach((i) => { const at = E.taps[3 + i], on = t >= at; $("rp" + i).className = "pill " + (on ? "pg" : "pz"); $("rp" + i).textContent = on ? "✓ Going" : "–"; set("rp" + i, { transform: `scale(${on ? lerp(1.35, 1, pop(t, at, 0.35)) : 1})` }); });

  // health
  l = vis("health", t); slam("c_health", l); rise("rosterCard", l, 0.05);
  const al = E.alert[0], on = t >= al, ap = outExpo(prog(t, al, al + 0.4));
  set("alertBar", { opacity: ap, transform: `translateY(${lerp(-60, 0, ap)}px)` });
  $("hp2").className = "pill " + (on ? "pr" : "pg"); $("hp2").textContent = on ? "⛔ Arm pain" : "✓ Ready · 95 left";
  set("hav2", { background: on ? "#4a1f1f" : "#1f4a33", color: on ? "#ff9b9b" : "#8af0b8" });
  set("hr2", { transform: `translateX(${on ? Math.sin((t - al) * 60) * 12 * clamp(1 - (t - al) * 2.2) : 0}px)`, background: on ? `rgba(255,93,93,${0.1 * clamp(1 - (t - al) * 0.6)})` : "transparent" });

  // develop
  l = vis("develop", t); slam("c_dev", l); rise("progCard", l, 0.05); rise("doneCard", l, 0.2);
  [20, 25, 30, 35].forEach((v, i) => { const p = outBack(prog(t, E.land[6 + i] - 0.1, E.land[6 + i] + 0.35)); set("bar" + i, { height: `${(v / 35) * 300 * clamp(p, 0, 1.2)}px` }); set("bv" + i, { opacity: clamp(p * 2) }); });
  const dn = t >= E.stamp[0]; $("donePill").className = "pill " + (dn ? "pg" : "pz"); $("donePill").textContent = dn ? "✓ Done" : "Start";
  set("donePill", { transform: `scale(${dn ? lerp(1.5, 1, pop(t, E.stamp[0], 0.35)) : 1}) rotate(${dn ? lerp(-10, 0, pop(t, E.stamp[0], 0.35)) : 0}deg)` });

  // stats
  l = vis("stats", t); slam("c_stats", l);
  const li = outExpo(prog(t, E.land[10] - 0.3, E.land[10] + 0.1)), merge = inOut(prog(t, E.stamp[5] - 0.35, E.stamp[5]));
  set("lineCard", { opacity: clamp(li * 2) * (1 - merge * 0.7), transform: `translateX(${lerp(800, 0, li)}px) translateY(${merge * 220}px) scale(${1 - merge * 0.15})` });
  rise("seasonCard", l, 0.15); rise("sprayCard", l, 0.25);
  const c = outExpo(prog(t, E.count[0], E.count[1]));
  $("sAvg").textContent = (0.412 * c).toFixed(3).replace(/^0/, ""); $("sH").textContent = Math.round(14 * c); $("sRbi").textContent = Math.round(11 * c);
  for (let i = 0; i < 8; i++) $("ss" + i).setAttribute("opacity", clamp(prog(t, E.count[0] + i * 0.14, E.count[0] + 0.2 + i * 0.14)));
  set("seasonCard", { boxShadow: `inset 0 0 0 ${3 * clamp(1 - Math.abs(t - E.stamp[5]) * 2)}px rgba(61,220,132,.9), 0 40px 80px -24px rgba(0,0,0,.9)` });

  // paid
  l = vis("paid", t); slam("c_paid", l); rise("duesCard", l, 0.05); rise("collCard", l, 0.2);
  let paidN = 0;
  [0, 1, 2, 3].forEach((i) => { const at = E.stamp[1 + i], ok = t >= at; if (ok) paidN++; $("ip" + i).className = "pill " + (ok ? "pg" : "pz"); $("ip" + i).textContent = ok ? "✓ Paid" : "Due"; set("ip" + i, { transform: `scale(${ok ? lerp(1.4, 1, pop(t, at, 0.3)) : 1})` }); });
  const last = paidN ? E.stamp[paidN] : null;
  $("collNum").textContent = "$" + Math.round(paidN ? lerp((paidN - 1) * 1350, paidN * 1350, outExpo(prog(t, last, last + 0.45))) : 0).toLocaleString("en-US");

  // reach
  l = vis("reach", t); slam("c_reach", l); rise("compose", l, 0.05);
  const msg = "Fall Classic: arrive 8 AM ⚾", send = E.taps[6];
  $("typed").innerHTML = msg.slice(0, Math.round(msg.length * prog(t, E.typing[0], E.typing[1]))) + (t < send ? `<span style="opacity:${Math.floor(t * 4) % 2}">|</span>` : "");
  set("sendBtn", { transform: `scale(${t >= send ? lerp(0.85, 1, outExpo(prog(t, send, send + 0.25))) : 1})` });
  [0, 1, 2].forEach((i) => { rise("mp" + i, l, 0.2 + i * 0.08, 0.5, 160); const b = pop(t, E.dings[3 + i], 0.4); set("bn" + i, { opacity: clamp(b * 2), transform: `translateY(${lerp(-100, 0, clamp(b))}px) scale(${lerp(0.9, 1, b)})` }); });

  // real
  l = vis("real", t, 0.1);
  set("laptop", { transform: `translateX(${lerp(-400, 0, outExpo(prog(l, 0, 0.7)))}px) rotateY(${lerp(14, 6, outExpo(prog(l, 0, 0.7)))}deg) scale(${lerp(1, 1.04, prog(l, 0.5, 4))})`, opacity: outExpo(prog(l, 0, 0.5)) });
  set("realPhone", { transform: `translateY(${lerp(600, 0, outExpo(prog(l, 0.15, 0.8)))}px) rotateY(-10deg) scale(.92)` });
  const words = ["Coaches.", "Clubs.", "Parents.", "Players."], wi = E.beats.filter((x) => t >= x).length - 1;
  $("aud").innerHTML = wi >= 0 ? `<span style="color:${wi % 2 ? "#3ddc84" : "#fff"}; text-shadow: 0 10px 40px rgba(0,0,0,.9)">${words[wi]}</span>` : "";
  if (wi >= 0) { const x = outExpo(prog(t, E.beats[wi], E.beats[wi] + 0.25)); set("aud", { opacity: clamp(x * 2), transform: `scale(${lerp(1.4, 1, x)}) skewX(${lerp(-12, 0, x)}deg)` }); }

  // end
  l = vis("end", t, 0.25);
  const e = outBack(prog(l, 0.05, 0.65)); set("endMark", { transform: `rotate(${lerp(-90, 0, e)}deg) scale(${lerp(0.3, 1, e)})`, opacity: clamp(e * 3) });
  const ew = outExpo(prog(l, 0.3, 0.9)); set("endWord", { opacity: ew, transform: `translateY(${lerp(50, 0, ew)}px) skewX(${lerp(-12, 0, ew)}deg)` });
  [["endTag", 0.9], ["endAud", 1.3], ["endCo", 1.7]].forEach(([id, at]) => { const x = outExpo(prog(l, at, at + 0.5)); set(id, { opacity: x, transform: `translateY(${lerp(24, 0, x)}px)` }); });

  let fl = 0; for (const [a] of Object.values(S)) if (a > 0) fl = Math.max(fl, 1 - Math.abs(t - a) / 0.09);
  fl = Math.max(fl, 1 - Math.abs(t - TL.batCrack) / 0.07, 1 - Math.abs(t - LV.hit) / 0.06);
  set("flash", { opacity: clamp(fl) * 0.45 });
  set("sweep", { transform: `translateX(${(((t * 0.45) % 1.6) - 0.3) * 100}%)`, opacity: 0.5 });
};
window.ready = Promise.all([document.fonts.ready, ...[...document.images].map((i) => i.decode().catch(() => {}))]);
render(0);
</script>
