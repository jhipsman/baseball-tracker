# Applies new database migrations to the hosted Supabase project automatically,
# so nobody has to run `npx supabase db push` by hand.
#
# Runs when files in supabase/migrations change on the repo's default branch
# (the one Vercel deploys to production), or manually from the Actions tab.
#
# One-time setup — add three repository secrets
# (GitHub → Settings → Secrets and variables → Actions → New repository secret):
#   SUPABASE_ACCESS_TOKEN  supabase.com/dashboard/account/tokens → Generate new token
#   SUPABASE_PROJECT_ID    Supabase → Project Settings → General → Project ID
#   SUPABASE_DB_PASSWORD   the database password set when creating the project
name: Deploy database migrations

on:
  push:
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:

concurrency:
  group: supabase-migrations
  cancel-in-progress: false

jobs:
  migrate:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Check secrets
        run: |
          # Strip stray spaces/newlines that sneak in when pasting secrets.
          token=$(printf '%s' "$SUPABASE_ACCESS_TOKEN" | tr -d '[:space:]')
          project=$(printf '%s' "$SUPABASE_PROJECT_ID" | tr -d '[:space:]')
          password=$(printf '%s' "$SUPABASE_DB_PASSWORD" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          echo "::add-mask::$token"
          echo "::add-mask::$password"

          ok=true
          if [ -z "$token" ]; then
            echo "::error::Secret SUPABASE_ACCESS_TOKEN is missing."; ok=false
          elif [ "${token#sbp_}" = "$token" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN should start with sbp_. It's a personal access token from supabase.com/dashboard/account/tokens (Generate new token), not the publishable/anon or secret API key."; ok=false
          fi
          if [ -z "$project" ]; then
            echo "::error::Secret SUPABASE_PROJECT_ID is missing."; ok=false
          elif ! printf '%s' "$project" | grep -Eq '^[a-z0-9]{20}$'; then
            echo "::error::SUPABASE_PROJECT_ID should be the 20-character Project ID (Project Settings → General), e.g. abcdefghijklmnopqrst, not the full URL."; ok=false
          fi
          if [ -z "$password" ]; then
            echo "::error::Secret SUPABASE_DB_PASSWORD is missing."; ok=false
          fi
          $ok || exit 1

          {
            echo "SUPABASE_ACCESS_TOKEN=$token"
            echo "SUPABASE_PROJECT_ID=$project"
            echo "SUPABASE_DB_PASSWORD=$password"
          } >> "$GITHUB_ENV"

      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Show pending migrations
        run: supabase db push --dry-run --password "$SUPABASE_DB_PASSWORD"

      - name: Apply migrations
        run: supabase db push --yes --password "$SUPABASE_DB_PASSWORD"
