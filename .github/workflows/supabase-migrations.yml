# Applies new database migrations to the hosted Supabase project automatically,
# so nobody has to run `npx supabase db push` by hand.
#
# Runs when files in supabase/migrations change on the repo's default branch
# (the one Vercel deploys to production), or manually from the Actions tab.
#
# One-time setup — add three repository secrets
# (GitHub → Settings → Secrets and variables → Actions → New repository secret):
#   SUPABASE_ACCESS_TOKEN  supabase.com/dashboard/account/tokens → Generate new token
#   SUPABASE_PROJECT_ID    Supabase → Project Settings → General → Project ID
#   SUPABASE_DB_PASSWORD   the database password set when creating the project
name: Deploy database migrations

on:
  push:
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:

concurrency:
  group: supabase-migrations
  cancel-in-progress: false

jobs:
  migrate:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Check secrets are set
        run: |
          missing=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "$SUPABASE_PROJECT_ID" ] && missing="$missing SUPABASE_PROJECT_ID"
          [ -z "$SUPABASE_DB_PASSWORD" ] && missing="$missing SUPABASE_DB_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (see the comment at the top of this workflow)"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Show pending migrations
        run: supabase db push --dry-run --password "$SUPABASE_DB_PASSWORD"

      - name: Apply migrations
        run: supabase db push --yes --password "$SUPABASE_DB_PASSWORD"
